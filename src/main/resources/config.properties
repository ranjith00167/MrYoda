# ═══════════════════════════════════════════════════════════════════
# AI Locator Healing Configuration
# ═══════════════════════════════════════════════════════════════════

# Gemini API Key — set via environment variable GEMINI_API_KEY
# Get your key from: https://aistudio.google.com/app/apikey
# In PowerShell: setx GEMINI_API_KEY "your-key-here"
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.0-flash

# AI Healing Feature Flags
ai.healing.enabled=true
ai.healing.cache.enabled=true
ai.healing.confidence.threshold=0.75
ai.healing.max.suggestions=5

# ═══════════════════════════════════════════════════════════════════
# AI Failure Analyzer — API Automation
# Automatically explains why API tests fail using Gemini AI.
# Requires GEMINI_API_KEY environment variable to be set.
# Set to false to disable without removing the env var.
# ═══════════════════════════════════════════════════════════════════
ai.failure.analyzer.enabled=false

# ═══════════════════════════════════════════════════════════════════
# API Encryption Configuration (AES-256-GCM)
# ═══════════════════════════════════════════════════════════════════
# encryption.mode: off | on | auto
#   off  = plain staging, no crypto
#   on   = always encrypt requests; responses decrypted if encrypted, else left as-is
#   auto = responses auto-detected (plain or encrypted); requests are encrypted
#          only after an encrypted response has been observed
# encryption.key: Base64-encoded 32-byte AES-256 key. Falls back to the
#   NEXT_PUBLIC_PAYLOAD_ENCRYPTION_KEY env var / encryption.key system property
#   when blank.
# encryption.iv: unused for GCM — a fresh random 12-byte IV is generated per message.
# Payload format: base64( IV[12] + ciphertext + authTag[16] ) inside { "__enc": "..." }
# Encrypted requests automatically carry the X-Encrypted: true header.
encryption.mode=auto
encryption.request.field=
encryption.transformation=AES/GCM/NoPadding
encryption.key=jE3X6+7Jtn77Z0O/uHVh2V+F4jmbU/PwO5n2f6pW7Fw=
encryption.iv=
