name: MrYoda Hybrid Automation Project

on:
  push:
    branches:
      - feature/stagingMrYoda

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        suite: [member, non_member, new_user]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build Project
        run: mvn -T 1C clean install -DskipTests

      - name: Run Tests
        run: |
          mvn test \
          -Dsurefire.suiteXmlFiles=test-suites/${{ matrix.suite }}/testng_${{ matrix.suite }}_all.xml \
          -Dheadless=true

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Report-${{ matrix.suite }}
          path: target/ExtentReport/