name: MrYoda Hybrid Automation Project

on:
  push:
    branches:
      - feature/stagingMrYoda

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project
        run: mvn clean install -DskipTests

      - name: Run Hybrid Tests
run: mvn test -Dsurefire.suiteXmlFiles=testng_all.xml -Dheadless=true